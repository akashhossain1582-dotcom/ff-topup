<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FF Top Up BD</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#222}
header{background:linear-gradient(135deg,#111827,#7c2d12);color:#fff;text-align:center;padding:24px 15px}
header h1{margin:0 0 6px;font-size:28px}.container{max-width:520px;width:92%;margin:18px auto}
.card{background:#fff;border-radius:15px;padding:18px;margin-bottom:16px;box-shadow:0 5px 18px #00000012}
h2{font-size:19px;margin:0 0 14px}input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-bottom:10px}
.packages{display:grid;grid-template-columns:1fr 1fr;gap:10px}.package{border:2px solid #eee;border-radius:12px;padding:13px;text-align:center;cursor:pointer}.package.selected{border-color:#f97316;background:#fff7ed}
.package b{display:block;margin:5px 0}.price{color:#ea580c;font-weight:bold}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pay button{padding:12px;border:2px solid #eee;background:#fff;border-radius:10px;font-weight:bold}.pay button.selected{border-color:#16a34a;background:#f0fdf4}
.mainbtn{width:100%;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,#f97316,#dc2626);color:#fff;font-size:17px;font-weight:bold}
.result{display:none}.success{color:#16a34a;font-weight:bold;font-size:20px}footer{text-align:center;padding:20px;color:#777;font-size:13px}
.small{font-size:12px;color:#777}.adminlink{display:block;text-align:center;margin:8px;color:#555}
</style>
</head>
<body>
<header><h1>🔥 FF TOP UP BD</h1><div>Fast & Easy Top-Up</div></header>
<div class="container">
<div class="card">
<h2>🎮 Player Information</h2>
<input id="uid" inputmode="numeric" placeholder="Free Fire UID">
</div>
<div class="card">
<h2>💎 Select Diamond</h2>
<div class="packages">
<div class="package" onclick="pick(this,'25 Diamond',20)">💎<b>25 Diamond</b><span class="price">৳20</span></div>
<div class="package" onclick="pick(this,'50 Diamond',35)">💎<b>50 Diamond</b><span class="price">৳35</span></div>
<div class="package" onclick="pick(this,'115 Diamond',75)">💎<b>115 Diamond</b><span class="price">৳75</span></div>
<div class="package" onclick="pick(this,'240 Diamond',150)">💎<b>240 Diamond</b><span class="price">৳150</span></div>
<div class="package" onclick="pick(this,'610 Diamond',380)">💎<b>610 Diamond</b><span class="price">৳380</span></div>
<div class="package" onclick="pick(this,'1240 Diamond',760)">💎<b>1240 Diamond</b><span class="price">৳760</span></div>
</div>
</div>
<div class="card">
<h2>💳 Payment Method</h2>
<div class="pay">
<button onclick="payment(this,'bKash')">📱 bKash</button>
<button onclick="payment(this,'Nagad')">📱 Nagad</button>
</div>
<p class="small">ডেমো: এখনো কোনো আসল পেমেন্ট নেওয়া হচ্ছে না।</p>
</div>
<div class="card">
<button class="mainbtn" onclick="order()">🚀 ORDER NOW</button>
</div>
<div class="card result" id="result"></div>
<a class="adminlink" href="admin.html">🔐 Admin Panel</a>
</div>
<footer>© 2026 FF TOP UP BD</footer>
<script>
let selected=null,payMethod='';
function pick(el,name,price){document.querySelectorAll('.package').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selected={name,price}}
function payment(el,name){document.querySelectorAll('.pay button').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');payMethod=name}
function order(){
 const uid=document.getElementById('uid').value.trim();
 if(!uid)return alert('আপনার Free Fire UID লিখুন');
 if(!selected)return alert('Diamond package নির্বাচন করুন');
 if(!payMethod)return alert('Payment method নির্বাচন করুন');
 const id='FF'+Date.now().toString().slice(-8);
 const item={id,uid,package:selected.name,amount:selected.price,payment:payMethod,status:'Pending',created:new Date().toLocaleString('bn-BD')};
 const orders=JSON.parse(localStorage.getItem('ffOrders')||'[]');orders.unshift(item);localStorage.setItem('ffOrders',JSON.stringify(orders));
 const r=document.getElementById('result');r.style.display='block';r.innerHTML='<div class="success">✅ Order Created</div><p>Order ID: <b>'+id+'</b></p><p>UID: <b>'+uid+'</b></p><p>'+selected.name+' — <b>৳'+selected.price+'</b></p><p>Status: <b>Pending</b></p>';
 r.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
